name: Container

on:
  workflow_dispatch:
  push:
    branches:
      - release/**
  pull_request:

permissions:
  contents: read
  packages: write

env:
  RPC_SERVER_VERSION: 1.0.3

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repository owner name
        run:  echo "REPOSITORY_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >>${GITHUB_ENV}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 25

      - name: Cache local Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build using Maven
        run: mvn package

      - name: Build Docker image
        run: docker build -t rpc:${{ env.RPC_SERVER_VERSION }} .

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub container registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_OWNER }}/rpc:${{ env.RPC_SERVER_VERSION }}

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ env.RPC_SERVER_VERSION }}
          path: target/server-${{ env.RPC_SERVER_VERSION }}.jar
